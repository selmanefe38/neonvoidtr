<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>NEON VOID</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; max-width: 100vw; max-height: 100vh; width: min(100vw, calc(100vh * 4 / 3)); height: auto; aspect-ratio: 4 / 3; touch-action: none; cursor: default; }
  #rot { display: none; position: fixed; inset: 0; background: rgba(4,5,13,.92); color: #6cf; font: 600 22px "Segoe UI", Roboto, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 5; }
  @media (orientation: portrait) and (pointer: coarse) { #rot { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="720"></canvas></div>
<div id="rot">Telefonu yan çevir (yatay) ve dokun ▸ NEON VOID<br><br>Rotate your phone to landscape</div>
<script src="js/util.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script>
  window.game = new Game(document.getElementById('c'));
  document.getElementById('rot').addEventListener('pointerdown', function () { this.style.display = 'none'; try { document.documentElement.requestFullscreen(); screen.orientation.lock('landscape').catch(function(){}); } catch (e) {} });
</script>
</body>
</html>
